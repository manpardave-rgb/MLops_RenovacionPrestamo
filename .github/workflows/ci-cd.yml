name: Pipeline CI/CD - Renovacion Prestamo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        # requirements-monitoring.txt incluye requirements.txt + evidently,
        # necesario para tests/test_monitoreo.py. Las imágenes Docker (más
        # abajo) siguen usando solo requirements.txt, sin evidently.
        pip install -r requirements-monitoring.txt

    - name: Linting del módulo de monitoreo (src/monitoring)
      run: |
        flake8 src/monitoring/ --max-line-length=100 --ignore=E203,W503,D100,D104

    - name: Ejecutar pruebas unitarias y Cobertura
      run: |
        pytest tests/ --ignore=tests/smoke/ --cov=src

    - name: Levantar servicios con Docker Compose y Validar Quality Gate
      run: |
        docker compose -f docker-compose.preprod.yml up --build --exit-code-from trainer