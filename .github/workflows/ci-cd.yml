name: Pipeline CI/CD - Renovacion Prestamo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # tu pipeline normal tarda pocos minutos; evita quemar
                          # las 6h de límite por defecto si algo se cuelga (p.ej.
                          # un healthcheck de docker compose que nunca pasa)

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        # requirements.txt,
        # necesario para tests/test_monitoreo.py. 
        pip install -r requirements.txt

    - name: Linting del módulo de monitoreo (src/monitoring)
      run: |
        flake8 src/monitoring/ --max-line-length=100 --ignore=E203,W503,D100,D104

    - name: Ejecutar pruebas unitarias y Cobertura
      run: |
        pytest tests/ --ignore=tests/smoke/ --cov=src

    - name: Levantar servicios con Docker Compose y Validar Quality Gate
      run: |
        docker compose -f docker-compose.preprod.yml up --build --exit-code-from trainer