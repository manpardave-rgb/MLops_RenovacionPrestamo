# docker-compose.preprod.yml — Stack de pre-producción (Renovación de Préstamo)
#
# Uso en Codespace:
#   docker compose -f docker-compose.preprod.yml up --build
#   O simplemente: make preprod-up
#
# Los puertos 8000 y 5000 se reenvían automáticamente en la pestaña PORTS.
#
# Orden de arranque garantizado:
#   mlflow → trainer → api
version: '3.9'

services:
  # ── Servicio 1: MLflow Tracking UI ───────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: prestamo-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root file:///mlruns
      --host 0.0.0.0 --port 5000
      --allowed-hosts "mlflow,mlflow:5000,localhost"
    ports:
      - '${MLFLOW_PORT:-5000}:5000'
    volumes:
      - mlruns_vol:/mlruns
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/health")']
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s
    networks:
      - prestamo-net

  # ── Servicio 2: Trainer ───────────────────────────────────────────────────
  # Corre UNA VEZ: carga/genera datos, entrena y valida el modelo (quality gate).
  # Si falla (exit 1), la API NO arranca — entorno inválido prevenido.
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.trainer
    container_name: prestamo-trainer
    env_file: .env.preprod
    volumes:
      - artifacts_vol:/app/artifacts
      - mlruns_vol:/app/mlruns
      - ./data:/app/data:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - prestamo-net

  # ── Servicio 3: API FastAPI ───────────────────────────────────────────────
  # Arranca solo cuando el trainer completó exitosamente.
  api:
    image: prestamo-renovacion-api:latest  # nombre fijo: deploy.sh y "make rollback" lo taggean/referencian
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prestamo-api
    ports:
      - '${API_PORT:-8000}:8000'
    env_file: .env.preprod
    volumes:
      - artifacts_vol:/app/artifacts
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      trainer:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - prestamo-net

# ── Volúmenes compartidos entre servicios ─────────────────────────────────
volumes:
  artifacts_vol:  # modelo.pkl, metrics.json, preprocess.json, kmeans.pkl
  mlruns_vol:      # experimentos MLflow

# ── Red interna del stack ─────────────────────────────────────────────────
networks:
  prestamo-net:
    driver: bridge
